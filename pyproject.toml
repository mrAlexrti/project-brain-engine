[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-brain-engine"
version = "0.1.0"
description = "Question-driven context engine for AI-assisted software development"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.16,<1.0",
    "rich>=14,<15",
    "PyYAML>=6,<7",
    "Jinja2>=3.1,<4",
    "FastAPI>=0.115,<1.0",
    "uvicorn>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1.0",
    "httpx>=0.28,<1.0",
]

[project.scripts]
brain = "brain_engine.cli:app"
brain-app = "brain_engine.application.launcher:main"

[tool.setuptools.package-data]
brain_engine = ["application/templates/*.html", "application/templates/**/*.html", "application/static/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
