{% extends "base.html" %}{% block heading %}{{ 'Edit' if item else 'Create' }} Brain Item{% endblock %}{% block content %}{% if error %}<section class="error">{{ error }}</section>{% endif %}<form method="post"><label>Item ID<input name="item_id" value="{{ item.id if item else '' }}" {% if item %}readonly{% endif %} required></label><label>Type<select name="item_type" {% if item %}disabled{% endif %}>{% for type in types %}<option {% if item and item.type == type %}selected{% endif %}>{{ type }}</option>{% endfor %}</select></label>{% if item %}<input type="hidden" name="item_type" value="{{ item.type }}">{% endif %}<label>Title<input name="title" value="{{ item.metadata.title if item else '' }}"></label><label>Content<textarea name="content" rows="12" required>{{ item.content if item else '' }}</textarea></label><button class="primary">Save as proposed</button></form>{% endblock %}
